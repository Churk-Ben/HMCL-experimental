name: Experimental Daily

# Composes a disposable release branch for the experimental channel:
#   1. start from `experimental` (the stable fork base: community + workflow infra)
#   2. merge upstream `main` and every always-on layer from layers.json
#   3. try the ranked upstream pull-request pool in order, applying as many as
#      possible up to `max_prs` (conflicts are retried with i18n union
#      resolution and a 3-way patch apply, then skipped)
#   4. build; if the build fails because two pull requests conflict semantically,
#      drop the pull request that most likely caused it and try again
#   5. push the release branch and trigger a release from it
#
# `experimental` itself is never modified by this workflow, and the release
# branch is only pushed once it builds.

on:
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:
    inputs:
      max_prs:
        description: Maximum number of upstream pull requests to apply
        type: number
      include:
        description: Comma-separated pull request numbers to force include
        type: string
        default: ''
      exclude:
        description: Comma-separated pull request numbers to force exclude
        type: string
        default: ''
      skip_release:
        description: Do not trigger a release after composing
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: experimental-daily
  cancel-in-progress: false

jobs:
  compose:
    if: github.repository_owner != 'HMCL-dev'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.compose.outputs.branch }}
      applied: ${{ steps.compose.outputs.applied }}
    steps:
      - name: Checkout experimental
        uses: actions/checkout@v6
        with:
          ref: experimental
          fetch-depth: 0
          # A PAT with the `workflow` scope is required because aggregated upstream
          # pull requests may add or modify files under .github/workflows, which
          # GITHUB_TOKEN is never allowed to push. Falls back to GITHUB_TOKEN.
          token: ${{ secrets.HMCL_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '17'
          java-package: jdk+fx

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compute layer conflict surface
        run: |
          set -euo pipefail
          git fetch -q origin experimental
          : > /tmp/conflict-files.txt
          while IFS= read -r layer; do
            [ -z "$layer" ] && continue
            git fetch -q origin "$layer"
            base="$(git merge-base origin/experimental FETCH_HEAD)"
            git diff --name-only "$base" FETCH_HEAD >> /tmp/conflict-files.txt || true
          done < <(jq -r '.layers[]' .github/experimental/layers.json)
          sort -u -o /tmp/conflict-files.txt /tmp/conflict-files.txt
          echo "Layer conflict surface: $(wc -l < /tmp/conflict-files.txt) files"

      - name: Select upstream pull requests
        id: select
        env:
          GH_TOKEN: ${{ secrets.HMCL_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(--policy .github/experimental/pr-policy.json
                --conflict-files /tmp/conflict-files.txt
                --github-output "$GITHUB_OUTPUT"
                --report /tmp/selection.md
                --report-json /tmp/pool.json)
          if [ -n "${{ inputs.include }}" ]; then args+=(--include "${{ inputs.include }}"); fi
          if [ -n "${{ inputs.exclude }}" ]; then args+=(--exclude "${{ inputs.exclude }}"); fi
          if [ -n "${{ inputs.max_prs }}" ]; then args+=(--max-prs "${{ inputs.max_prs }}"); fi
          python3 .github/scripts/select-prs.py "${args[@]}"

      - name: Compose release branch
        id: compose
        env:
          GH_TOKEN: ${{ secrets.HMCL_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: |
          set -euo pipefail

          max_prs="${{ inputs.max_prs }}"
          [ -z "$max_prs" ] && max_prs="$(jq -r '.max_prs' .github/experimental/pr-policy.json)"
          pool="${{ steps.select.outputs.prs }}"

          apply_pr() {
            pr="$1"
            # Strategy 1: merge, resolving additive i18n conflicts by union.
            if git fetch --no-tags -q upstream "pull/$pr/head"; then
              if git merge --no-edit FETCH_HEAD >/dev/null 2>&1; then
                return 0
              fi
              if python3 .github/scripts/resolve-i18n.py >/dev/null 2>&1 \
                  && [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                git commit --no-edit >/dev/null 2>&1 && return 0
              fi
              git merge --abort >/dev/null 2>&1 || true
            fi
            # Strategy 2: apply the pull request diff with 3-way merge.
            if curl -fsSL "https://github.com/HMCL-dev/HMCL/pull/$pr.diff" -o /tmp/pr.diff 2>/dev/null; then
              if git apply --3way /tmp/pr.diff >/dev/null 2>&1 \
                  && [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                git add -A && git commit -m "Apply #$pr" >/dev/null 2>&1 && return 0
              fi
              git reset --hard -q && git clean -fdq
            fi
            return 1
          }

          branch="release/$(date -u +%Y%m%d)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"

          git remote add upstream https://github.com/HMCL-dev/HMCL.git

          echo "::group::Sync upstream main"
          git fetch upstream main
          git merge --no-edit upstream/main
          echo "::endgroup::"

          echo "::group::Apply always-on layers"
          while IFS= read -r layer; do
            [ -z "$layer" ] && continue
            echo "Merging layer: $layer"
            git fetch origin "$layer"
            python3 .github/scripts/merge-layer.py "$layer" FETCH_HEAD
          done < <(jq -r '.layers[]' .github/experimental/layers.json)
          echo "::endgroup::"
          python3 .github/scripts/apply-compatibility.py
          base="$(git rev-parse HEAD)"

          validate_composition() {
            # Match both release environments, including the runtime used for tests.
            export GITHUB_SHA="$(git rev-parse HEAD)"
            # A different composition has a different SHA/version; remove stale named artifacts.
            mkdir -p HMCL/build/libs
            rm -f HMCL/build/libs/HMCL-*
            JAVA_HOME="$JAVA_HOME_17_X64" xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel &&
            python3 .github/scripts/check-experimental-artifacts.py &&
            JAVA_HOME="$JAVA_HOME_25_X64" xvfb-run --auto-servernum ./gradlew check --no-daemon --parallel
          }

          # Mandatory layers must pass on their own before considering optional PRs.
          if ! validate_composition > /tmp/build.log 2>&1; then
            cat /tmp/build.log
            echo "::error::Mandatory-layer baseline failed; no release branch was pushed"
            exit 1
          fi

          excluded=""
          applied=""
          skipped=""
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            echo "::group::Attempt $attempt (max $max_prs)"
            git reset --hard -q "$base"
            applied=""
            skipped=""
            for pr in $(echo "$pool" | tr ',' ' '); do
              [ -z "$pr" ] && continue
              case " $excluded " in *" $pr "*) continue ;; esac
              [ "$(echo $applied | wc -w)" -ge "$max_prs" ] && break
              if apply_pr "$pr"; then
                applied="$applied $pr"
                echo "applied #$pr ($(echo $applied | wc -w)/$max_prs)"
              else
                skipped="$skipped $pr"
                echo "skipped #$pr"
              fi
            done
            echo "applied:${applied:- none}"
            echo "skipped:${skipped:- none}"
            echo "::endgroup::"

            python3 .github/scripts/apply-compatibility.py
            if validate_composition >/tmp/build.log 2>&1; then
              echo "Build passed with $(echo $applied | wc -w) pull request(s)"
              break
            fi

            echo "Build failed; identifying the offending pull request"
            echo $applied | tr ' ' '\n' > /tmp/applied.txt
            drop="$(python3 .github/scripts/pick-drop.py /tmp/pool.json /tmp/applied.txt /tmp/build.log "$GITHUB_WORKSPACE" || true)"
            if [ -z "$drop" ]; then
              echo "::error::build failed and no applied pull request matches the failing files"
              tail -60 /tmp/build.log
              exit 1
            fi
            echo "Dropping #$drop and retrying"
            excluded="$excluded $drop"
            if [ "$attempt" -ge 12 ]; then
              echo "::error::too many build attempts"
              exit 1
            fi
          done

          echo "applied=${applied# }" >> "$GITHUB_OUTPUT"
          echo "excluded=${excluded# }" >> "$GITHUB_OUTPUT"

          echo $applied | tr ' ' '\n' > /tmp/applied.txt
          echo $skipped | tr ' ' '\n' > /tmp/skipped.txt
          echo $excluded | tr ' ' '\n' > /tmp/dropped.txt
          python3 .github/scripts/render-composition.py \
            /tmp/pool.json /tmp/applied.txt /tmp/skipped.txt /tmp/dropped.txt .github/experimental/last-composition.md
          git add .github/experimental/last-composition.md
          git commit -m "chore: record composition for $branch" >/dev/null 2>&1 || true

          git push -u origin --force-with-lease "$branch"

      - name: Upload composition diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: experimental-composition-diagnostics
          path: |
            /tmp/build.log
            /tmp/selection.md
            /tmp/pool.json
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: ignore

      - name: Trigger release
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.skip_release != true) }}
        env:
          GH_TOKEN: ${{ secrets.HMCL_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Create Release" -R "$GITHUB_REPOSITORY" \
            --ref "${{ steps.compose.outputs.branch }}" -f prerelease=false
