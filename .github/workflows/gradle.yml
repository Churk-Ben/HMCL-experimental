name: Java CI

on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish an unofficial release in this fork
        type: boolean
        default: false
      prerelease:
        description: Mark the fork release as a prerelease
        type: boolean
        default: true
  workflow_call:
    inputs:
      publish_release:
        type: boolean
        default: false
      prerelease:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        java-package: 'jdk+fx'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-cleanup: never
    - name: Prepare signing key
      shell: bash
      env:
        HMCL_SIGNATURE_KEY_BASE64: ${{ secrets.HMCL_SIGNATURE_KEY }}
      run: |
        if [ -n "${HMCL_SIGNATURE_KEY_BASE64:-}" ]; then
          printf '%s' "$HMCL_SIGNATURE_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/hmcl_signature_key.der"
          echo "HMCL_SIGNATURE_KEY=$RUNNER_TEMP/hmcl_signature_key.der" >> "$GITHUB_ENV"
        else
          echo "::warning::HMCL_SIGNATURE_KEY is not configured; the build will not be signed"
        fi
    - name: Build with Gradle
      run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
        CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    - name: Get short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
    - name: Upload JAR
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-jar
        path: HMCL/build/libs/HMCL-*.jar
        archive: false
    - name: Upload EXE
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-exe
        path: HMCL/build/libs/HMCL-*.exe
        archive: false
    - name: Upload SH
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-sh
        path: HMCL/build/libs/HMCL-*.sh
        archive: false
    - name: Upload DEB
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-deb
        path: HMCL/build/libs/HMCL-*.deb
        archive: false
    - name: Upload RPM
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-rpm
        path: HMCL/build/libs/HMCL-*.rpm
        archive: false
    - name: Prepare release bundle
      id: bundle
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        jars=(HMCL/build/libs/HMCL-*.jar)
        [[ ${#jars[@]} -eq 1 ]]
        filename="$(basename "${jars[0]}" .jar)"
        version="${filename#HMCL-}"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        mkdir -p HMCL/build/release
        for extension in jar exe sh deb rpm; do
          artifact="HMCL/build/libs/$filename.$extension"
          # Layers are optional: skip artifacts that the current composition did not produce.
          [ -f "$artifact" ] || continue
          checksum="$(tr -d '\r\n' < "$artifact.sha256")"
          printf '%s  %s\n' "$checksum" "$artifact" | sha256sum --check
          cp "$artifact" "$artifact.sha256" HMCL/build/release/
        done
        cd HMCL/build/release
        jar_sha1="$(sha1sum "HMCL-$version.jar" | cut -d' ' -f1)"
        printf '{"version":"%s","jar":"https://github.com/%s/releases/latest/download/HMCL-%s.jar","jarsha1":"%s"}\n' \
          "$version" "$GITHUB_REPOSITORY" "$version" "$jar_sha1" > update-exp.json
        cp update-exp.json update.json
        sha256sum -- *.jar *.exe *.sh *.deb *.rpm update-exp.json update.json > SHA256SUMS
    - name: Upload release bundle
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-release
        path: HMCL/build/release/*
        if-no-files-found: error

    outputs:
      version: ${{ steps.bundle.outputs.version }}

  check-modern:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-cleanup: never
    - name: Check with JavaFX 27
      run: xvfb-run --auto-servernum ./gradlew check --no-daemon --parallel
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
        CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

  release:
    if: github.repository_owner != 'HMCL-dev' && github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [build, check-modern]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fork-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
    - name: Checkout composition metadata
      uses: actions/checkout@v6
    - name: Download release bundle
      uses: actions/download-artifact@v8
      with:
        pattern: HMCL-*-release
        merge-multiple: true
        path: release
    - name: Verify release bundle
      working-directory: release
      run: sha256sum --check SHA256SUMS
    - name: Create unofficial release
      working-directory: release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        RELEASE_VERSION: ${{ needs.build.outputs.version }}
        RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      run: |
        set -euo pipefail
        tag="v$RELEASE_VERSION"
        latest=true
        if [[ "$RELEASE_PRERELEASE" == true ]]; then
          latest=false
        fi
        {
          printf 'Experimental channel build from `%s`.\n\n' "$GITHUB_REF_NAME"
          printf 'This downstream fork aggressively tracks upstream; features may be added or removed at any time.\n\n'
          printf 'Includes RPM packaging and JavaFX 27 for Java 25 or newer.\n\n'
          printf 'Commit: [%s](https://github.com/%s/commit/%s)\n\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          printf 'Build: https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          printf 'SHA-256 checksums:\n\n```text\n'
          cat SHA256SUMS
          printf '```\n'
        } > "$RUNNER_TEMP/RELEASE_NOTE.md"
        # Experimental compositions record the upstream pull requests they include.
        composition="$GITHUB_WORKSPACE/.github/experimental/last-composition.md"
        if [ -f "$composition" ]; then
          { printf '\n---\n\n'; cat "$composition"; } >> "$RUNNER_TEMP/RELEASE_NOTE.md"
        fi
        if gh release view "$tag" > /dev/null 2>&1; then
          gh release upload "$tag" HMCL-* SHA256SUMS update-exp.json update.json --clobber
          gh release edit "$tag" --prerelease="$RELEASE_PRERELEASE" --latest="$latest" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTE.md"
        else
          gh release create "$tag" HMCL-* SHA256SUMS update-exp.json update.json \
            --target "$GITHUB_SHA" \
            --title "HMCL $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTE.md" \
            --prerelease="$RELEASE_PRERELEASE" --latest="$latest"
        fi
        gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
